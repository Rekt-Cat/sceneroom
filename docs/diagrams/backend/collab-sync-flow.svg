<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
  <title id="t">One edit travelling from Alice to Bob</title>
  <desc id="d">Alice drags a slider. A store action makes a new scene. The sync layer compares it with the old scene and writes only the difference into the Yjs document in one transaction marked as hers; the UndoManager records it. The provider sends it to the collab server, which checks her role and the size and forwards it. Bob's Yjs document fires an event, his sync layer rebuilds the changed objects, checks them with Zod and puts them in his store without an Undo step, and his 3D view redraws. Alice's Undo reverts only her own change. Selections and the one editor per object lock travel by awareness.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#13202a"/></marker></defs>
  <rect width="960" height="600" fill="#f2f5f6"/>
  <text x="32" y="38" font-size="22" font-weight="700" fill="#13202a">One edit, from Alice to Bob</text>
  <text x="32" y="60" font-size="13" fill="#55656f">Alice drags the Roughness slider on a cube. Planned (steps M3 to M5 in docs/COLLABORATION.md).</text>

  <text x="32" y="92" font-size="13" font-weight="700" fill="#0a6c8a">ALICE'S BROWSER</text>
  <rect x="32" y="100" width="210" height="96" rx="12" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="44" y="122" font-size="13" font-weight="700" fill="#13202a">1. Store action</text>
  <text x="44" y="142" font-size="12" fill="#13202a">The slider calls an action;</text>
  <text x="44" y="159" font-size="12" fill="#13202a">a plain function makes the</text>
  <text x="44" y="176" font-size="12" fill="#13202a">new scene (as today).</text>
  <path d="M242 148 H270" stroke="#13202a" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <rect x="270" y="100" width="230" height="96" rx="12" fill="#fbeed2" stroke="#8a5a00" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="282" y="122" font-size="13" font-weight="700" fill="#13202a">2. Sync layer: the difference</text>
  <text x="282" y="142" font-size="12" fill="#13202a">Compares new and old scene:</text>
  <text x="282" y="159" font-size="12" fill="#13202a">only cube.material.roughness</text>
  <text x="282" y="176" font-size="12" fill="#13202a">changed (a few times a second).</text>
  <path d="M500 148 H528" stroke="#13202a" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <rect x="528" y="100" width="210" height="96" rx="12" fill="#fbeed2" stroke="#8a5a00" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="540" y="122" font-size="13" font-weight="700" fill="#13202a">3. Yjs transaction</text>
  <text x="540" y="142" font-size="12" fill="#13202a">One small update, marked</text>
  <text x="540" y="159" font-size="12" fill="#13202a">"mine". The UndoManager</text>
  <text x="540" y="176" font-size="12" fill="#13202a">records it as Alice's step.</text>
  <path d="M738 148 H766" stroke="#13202a" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <rect x="766" y="100" width="162" height="96" rx="12" fill="#fbeed2" stroke="#8a5a00" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="778" y="122" font-size="13" font-weight="700" fill="#13202a">4. Provider</text>
  <text x="778" y="142" font-size="12" fill="#13202a">sends it over the</text>
  <text x="778" y="159" font-size="12" fill="#13202a">WebSocket. Offline:</text>
  <text x="778" y="176" font-size="12" fill="#13202a">kept and sent later.</text>

  <path d="M847 196 V226" stroke="#13202a" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <text x="528" y="220" font-size="13" font-weight="700" fill="#8a5a00">THE COLLAB SERVER</text>
  <rect x="528" y="226" width="400" height="84" rx="12" fill="#fbeed2" stroke="#8a5a00" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="540" y="248" font-size="13" font-weight="700" fill="#13202a">5. Check, save, forward</text>
  <text x="540" y="268" font-size="12" fill="#13202a">Is her token valid? Is she an editor (a viewer is read-only)?</text>
  <text x="540" y="285" font-size="12" fill="#13202a">Is the message small enough? Then save the document</text>
  <text x="540" y="302" font-size="12" fill="#13202a">and send the update to everyone else in the room.</text>
  <path d="M528 268 H500" stroke="#13202a" stroke-width="2.2" fill="none"/>
  <path d="M500 268 H400 V330" stroke="#13202a" stroke-width="2.2" fill="none" marker-end="url(#a)"/>

  <text x="32" y="330" font-size="13" font-weight="700" fill="#0a6c8a">BOB'S BROWSER</text>
  <rect x="270" y="338" width="230" height="96" rx="12" fill="#fbeed2" stroke="#8a5a00" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="282" y="360" font-size="13" font-weight="700" fill="#13202a">6. His Yjs document</text>
  <text x="282" y="380" font-size="12" fill="#13202a">applies the update and fires</text>
  <text x="282" y="397" font-size="12" fill="#13202a">an event: "not mine, and the</text>
  <text x="282" y="414" font-size="12" fill="#13202a">cube's material changed".</text>
  <path d="M270 386 H242" stroke="#13202a" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <rect x="32" y="338" width="210" height="96" rx="12" fill="#fbeed2" stroke="#8a5a00" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="44" y="360" font-size="13" font-weight="700" fill="#13202a">7. Check, then store</text>
  <text x="44" y="380" font-size="12" fill="#13202a">Rebuilds only the cube,</text>
  <text x="44" y="397" font-size="12" fill="#13202a">checks it with Zod, puts it in</text>
  <text x="44" y="414" font-size="12" fill="#13202a">his store with NO Undo step.</text>
  <path d="M137 434 V462" stroke="#13202a" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <rect x="32" y="462" width="210" height="60" rx="12" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="44" y="484" font-size="13" font-weight="700" fill="#13202a">8. His 3D view redraws</text>
  <text x="44" y="503" font-size="12" fill="#13202a">the cube is shinier (as today)</text>

  <rect x="270" y="462" width="200" height="110" rx="12" fill="#fff" stroke="#e08a00" stroke-width="2"/>
  <text x="282" y="484" font-size="13" font-weight="700" fill="#13202a">Undo</text>
  <text x="282" y="503" font-size="12" fill="#13202a">Alice presses Undo: only</text>
  <text x="282" y="520" font-size="12" fill="#13202a">HER change goes back. Bob's</text>
  <text x="282" y="537" font-size="12" fill="#13202a">edits stay (Yjs UndoManager,</text>
  <text x="282" y="554" font-size="12" fill="#13202a">not scene snapshots).</text>
  <rect x="486" y="462" width="220" height="110" rx="12" fill="#fff" stroke="#0a6c8a" stroke-width="2"/>
  <text x="498" y="484" font-size="13" font-weight="700" fill="#13202a">Awareness (not saved)</text>
  <text x="498" y="503" font-size="12" fill="#13202a">Who is here, their colour,</text>
  <text x="498" y="520" font-size="12" fill="#13202a">what they have selected,</text>
  <text x="498" y="537" font-size="12" fill="#13202a">and "Alice is editing the</text>
  <text x="498" y="554" font-size="12" fill="#13202a">points of Cube" (a lock).</text>
  <rect x="722" y="462" width="206" height="110" rx="12" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="734" y="484" font-size="13" font-weight="700" fill="#13202a">Big files</text>
  <text x="734" y="503" font-size="12" fill="#13202a">A mesh or picture goes by</text>
  <text x="734" y="520" font-size="12" fill="#13202a">its hash over HTTPS first;</text>
  <text x="734" y="537" font-size="12" fill="#13202a">Bob downloads it by id and</text>
  <text x="734" y="554" font-size="12" fill="#13202a">checks the hash matches.</text>
</svg>
