<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
  <title id="t">Projects and scenes: how a project with several scenes is kept and saved</title>
  <desc id="d">The project store lists the scenes. The open scene lives in the scene store and everything that edits a scene works on it. The other scenes are parked with their own selection and undo history. Switching swaps them. Autosave writes the whole project to the browser storage as one record.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#13202a"/></marker>
  </defs>
  <rect width="960" height="640" fill="#f2f5f6"/>
  <text x="32" y="38" font-size="22" font-weight="700" fill="#13202a">Projects and scenes (Phase 5b, steps 1 and 2; storage updated for Phase 5c)</text>
  <text x="32" y="60" font-size="13" fill="#55656f">One project, many scenes. Only the open scene is "live"; the others wait, each with its own undo history.</text>

  <!-- top bar -->
  <rect x="32" y="84" width="896" height="52" rx="10" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="48" y="116" font-size="14" fill="#55656f">Top bar:</text>
  <text x="112" y="116" font-size="14" font-weight="600" fill="#13202a">Untitled project /</text>
  <rect x="250" y="95" width="104" height="30" rx="7" fill="#dff1f7" stroke="#0a6c8a" stroke-width="2"/>
  <text x="302" y="115" font-size="13" text-anchor="middle" fill="#13202a">Characters ⋯</text>
  <rect x="362" y="95" width="92" height="30" rx="7" fill="#fff" stroke="#c4d0d6" stroke-width="2"/>
  <text x="408" y="115" font-size="13" text-anchor="middle" fill="#55656f">Buildings</text>
  <rect x="462" y="95" width="104" height="30" rx="7" fill="#fff" stroke="#c4d0d6" stroke-width="2"/>
  <text x="514" y="115" font-size="13" text-anchor="middle" fill="#55656f">Environment</text>
  <rect x="574" y="95" width="92" height="30" rx="7" fill="#fff" stroke="#c4d0d6" stroke-width="2"/>
  <text x="620" y="115" font-size="13" text-anchor="middle" fill="#55656f">Assembly</text>
  <circle cx="694" cy="110" r="14" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="694" y="116" font-size="18" text-anchor="middle" fill="#13202a">+</text>
  <text x="722" y="115" font-size="12" fill="#55656f">new scene from a template · double-click renames · ⋯ menu</text>

  <!-- project store -->
  <rect x="32" y="190" width="300" height="190" rx="12" fill="#e9eef0" stroke="#13202a" stroke-width="2"/>
  <text x="48" y="216" font-size="15" font-weight="700" fill="#13202a">projectStore</text>
  <text x="48" y="238" font-size="12.5" fill="#13202a">name, list of scenes (id + name),</text>
  <text x="48" y="256" font-size="12.5" fill="#13202a">which scene is open, and the</text>
  <text x="48" y="274" font-size="12.5" fill="#13202a">PARKED scenes:</text>
  <rect x="48" y="288" width="268" height="40" rx="7" fill="#fff" stroke="#8a5a00" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="60" y="305" font-size="12" fill="#13202a">Buildings: scene + selection + undo</text>
  <text x="60" y="320" font-size="12" fill="#13202a">Environment, Assembly: the same</text>
  <text x="48" y="352" font-size="12" fill="#55656f">new / rename / duplicate / delete /</text>
  <text x="48" y="368" font-size="12" fill="#55656f">move / switch / load. Pure rules in shared.</text>

  <!-- scene store -->
  <rect x="420" y="190" width="240" height="190" rx="12" fill="#dff1f7" stroke="#0a6c8a" stroke-width="2.5"/>
  <text x="436" y="216" font-size="15" font-weight="700" fill="#13202a">sceneStore (the OPEN scene)</text>
  <text x="436" y="238" font-size="12.5" fill="#13202a">scene, selection, undo history,</text>
  <text x="436" y="256" font-size="12.5" fill="#13202a">clipboard, gizmo mode</text>
  <text x="436" y="284" font-size="12.5" fill="#13202a">Everything that edits a scene</text>
  <text x="436" y="302" font-size="12.5" fill="#13202a">(tools, panels, edit mode, undo)</text>
  <text x="436" y="320" font-size="12.5" fill="#13202a">is unchanged and works on this.</text>
  <text x="436" y="350" font-size="12" fill="#55656f">Clipboard is shared: copy in one</text>
  <text x="436" y="366" font-size="12" fill="#55656f">scene, paste in another.</text>

  <!-- switch arrows -->
  <path d="M332 262 H418" stroke="#13202a" stroke-width="2.2" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="375" y="252" font-size="12" font-weight="600" text-anchor="middle" fill="#13202a">switch</text>
  <text x="375" y="288" font-size="11" text-anchor="middle" fill="#55656f">swap</text>

  <!-- tabs to store -->
  <path d="M302 136 V188" stroke="#13202a" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <text x="312" y="168" font-size="12" fill="#55656f">click a tab</text>

  <!-- autosave -->
  <rect x="740" y="190" width="188" height="86" rx="12" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="756" y="216" font-size="15" font-weight="700" fill="#13202a">autosave</text>
  <text x="756" y="238" font-size="12.5" fill="#13202a">waits 0.5 s after the last</text>
  <text x="756" y="256" font-size="12.5" fill="#13202a">change, then writes once</text>
  <path d="M660 240 H738" stroke="#13202a" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <text x="699" y="232" font-size="11" text-anchor="middle" fill="#55656f">getProject()</text>

  <!-- IndexedDB -->
  <rect x="700" y="370" width="228" height="150" rx="12" fill="#e0f2e8" stroke="#1c7a4b" stroke-width="2.2"/>
  <text x="716" y="394" font-size="15" font-weight="700" fill="#13202a">Browser storage (IndexedDB)</text>
  <text x="716" y="415" font-size="12" fill="#13202a">"project:&lt;id&gt;": one record per project</text>
  <text x="716" y="432" font-size="12" fill="#13202a">"project-index": the home-screen cards</text>
  <text x="716" y="449" font-size="12" fill="#13202a">"thumb:&lt;id&gt;": the card picture</text>
  <text x="716" y="466" font-size="12" fill="#13202a">"assets": model and mesh files, stored</text>
  <text x="716" y="481" font-size="12" fill="#13202a">  ONCE by fingerprint, shared by all</text>
  <text x="716" y="498" font-size="12" fill="#13202a">old "project" / "current": read once,</text>
  <text x="716" y="513" font-size="12" fill="#13202a">  become the first card, kept as backup</text>
  <path d="M834 276 V368" stroke="#13202a" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <text x="846" y="326" font-size="12" fill="#55656f">save</text>
  <path d="M700 470 H420 V384" stroke="#13202a" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#a)"/>
  <text x="560" y="462" font-size="12" text-anchor="middle" fill="#55656f">on page load: loadProject(), undo starts empty</text>

  <!-- file -->
  <rect x="420" y="410" width="240" height="110" rx="12" fill="#fff" stroke="#0a6c8a" stroke-width="2"/>
  <text x="436" y="436" font-size="14" font-weight="700" fill="#13202a">.sceneroom file (version 2)</text>
  <text x="436" y="458" font-size="12.5" fill="#13202a">header: project (every scene)</text>
  <text x="436" y="476" font-size="12.5" fill="#13202a">then each model / mesh file ONCE</text>
  <text x="436" y="494" font-size="12" fill="#55656f">Open replaces · Add scenes adds ·</text>
  <text x="436" y="510" font-size="12" fill="#55656f">old one-scene files still open</text>

  <!-- library -->
  <rect x="32" y="540" width="896" height="84" rx="12" fill="#fff" stroke="#8a5a00" stroke-width="2"/>
  <text x="48" y="566" font-size="14" font-weight="700" fill="#13202a">Assets tab = the project library (the same in every scene)</text>
  <text x="48" y="588" font-size="12.5" fill="#13202a">Models: the union of every scene's records; placing one adds its record to the open scene.</text>
  <text x="48" y="606" font-size="12.5" fill="#13202a">Prefabs: placed copies are linked (inside locked). Double-click one to open it as its own scene (tab ◆); each change rebuilds every copy.</text>

  <!-- rules -->
  <rect x="32" y="410" width="360" height="110" rx="12" fill="#fff" stroke="#c4d0d6" stroke-width="2"/>
  <text x="48" y="436" font-size="14" font-weight="700" fill="#13202a">Rules</text>
  <text x="48" y="458" font-size="12.5" fill="#13202a">• Switching leaves edit mode and ends a drag.</text>
  <text x="48" y="476" font-size="12.5" fill="#13202a">• A cut waiting in the clipboard becomes a copy.</text>
  <text x="48" y="494" font-size="12.5" fill="#13202a">• The last scene cannot be deleted; delete asks first.</text>
  <text x="48" y="512" font-size="12.5" fill="#13202a">• Up to 50 scenes, names unique, max 60 letters.</text>
</svg>
