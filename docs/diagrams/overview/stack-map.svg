<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
  <title id="t">The tool stack: what we use and what we chose it over</title>
  <desc id="d">Four layers of tools. Editor: Next.js, React, three.js with react-three-fiber, Zustand, Zod, Tailwind. Code and tests: TypeScript, pnpm, Turborepo, Vitest, Playwright, Prettier and ESLint, husky, GitHub Actions. Hosting: Vercel. Online part, planned and drawn dashed: Yjs, Hocuspocus, y-indexeddb, Postgres with Prisma and Docker, Cloudflare R2, login not decided yet. Under each tool in grey is what else could do the same job.</desc>
  <rect width="960" height="560" fill="#f2f5f6"/>
  <text x="32" y="38" font-size="22" font-weight="700" fill="#13202a">The tool stack, and what each one was chosen over</text>
  <text x="32" y="60" font-size="13" fill="#55656f">Solid = in use. Dashed = planned. Grey line = what else does the same job. Reasons: docs/overview/WHY-THESE-TOOLS.md</text>

  <text x="32" y="92" font-size="13" font-weight="700" fill="#0a6c8a">THE EDITOR (in the browser)</text>
  <rect x="32" y="100" width="140" height="64" rx="10" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="44" y="124" font-size="13" font-weight="700" fill="#13202a">Next.js 16</text><text x="44" y="146" font-size="10.5" fill="#6a7a84">not Vite, Remix</text>
  <rect x="184" y="100" width="130" height="64" rx="10" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="196" y="124" font-size="13" font-weight="700" fill="#13202a">React 19</text><text x="196" y="146" font-size="10.5" fill="#6a7a84">not Vue, Svelte</text>
  <rect x="326" y="100" width="170" height="64" rx="10" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="338" y="124" font-size="13" font-weight="700" fill="#13202a">three.js + r3f</text><text x="338" y="146" font-size="10.5" fill="#6a7a84">not Babylon, PlayCanvas</text>
  <rect x="508" y="100" width="130" height="64" rx="10" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="520" y="124" font-size="13" font-weight="700" fill="#13202a">Zustand</text><text x="520" y="146" font-size="10.5" fill="#6a7a84">not Redux, Jotai</text>
  <rect x="650" y="100" width="130" height="64" rx="10" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="662" y="124" font-size="13" font-weight="700" fill="#13202a">Zod</text><text x="662" y="146" font-size="10.5" fill="#6a7a84">not Yup, Valibot</text>
  <rect x="792" y="100" width="136" height="64" rx="10" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="804" y="124" font-size="13" font-weight="700" fill="#13202a">Tailwind 4</text><text x="804" y="146" font-size="10.5" fill="#6a7a84">not CSS Modules</text>

  <text x="32" y="198" font-size="13" font-weight="700" fill="#0a6c8a">CODE, TESTS AND SHIPPING</text>
  <rect x="32" y="206" width="110" height="64" rx="10" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="44" y="230" font-size="13" font-weight="700" fill="#13202a">TypeScript</text><text x="44" y="252" font-size="10.5" fill="#6a7a84">not plain JS</text>
  <rect x="152" y="206" width="100" height="64" rx="10" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="164" y="230" font-size="13" font-weight="700" fill="#13202a">pnpm 12</text><text x="164" y="252" font-size="10.5" fill="#6a7a84">not npm, Yarn</text>
  <rect x="262" y="206" width="120" height="64" rx="10" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="274" y="230" font-size="13" font-weight="700" fill="#13202a">Turborepo</text><text x="274" y="252" font-size="10.5" fill="#6a7a84">not Nx, Lerna</text>
  <rect x="392" y="206" width="100" height="64" rx="10" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="404" y="230" font-size="13" font-weight="700" fill="#13202a">Vitest</text><text x="404" y="252" font-size="10.5" fill="#6a7a84">not Jest</text>
  <rect x="502" y="206" width="120" height="64" rx="10" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="514" y="230" font-size="13" font-weight="700" fill="#13202a">Playwright</text><text x="514" y="252" font-size="10.5" fill="#6a7a84">not Cypress</text>
  <rect x="632" y="206" width="130" height="64" rx="10" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="644" y="230" font-size="13" font-weight="700" fill="#13202a">Prettier + ESLint</text><text x="644" y="252" font-size="10.5" fill="#6a7a84">not Biome</text>
  <rect x="772" y="206" width="156" height="64" rx="10" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="784" y="230" font-size="13" font-weight="700" fill="#13202a">husky + Actions</text><text x="784" y="252" font-size="10.5" fill="#6a7a84">not lefthook, other CI</text>
  <rect x="32" y="282" width="250" height="52" rx="10" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="44" y="304" font-size="13" font-weight="700" fill="#13202a">Vercel (web app)</text><text x="44" y="322" font-size="10.5" fill="#6a7a84">not Netlify, Cloudflare Pages, a VPS</text>
  <rect x="294" y="282" width="250" height="52" rx="10" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="306" y="304" font-size="13" font-weight="700" fill="#13202a">IndexedDB (saving locally)</text><text x="306" y="322" font-size="10.5" fill="#6a7a84">not localStorage, OPFS</text>
  <rect x="556" y="282" width="372" height="52" rx="10" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="568" y="304" font-size="13" font-weight="700" fill="#13202a">.sceneroom file + GLB export</text><text x="568" y="322" font-size="10.5" fill="#6a7a84">not only glTF, FBX or USD (those are later)</text>

  <text x="32" y="368" font-size="13" font-weight="700" fill="#8a5a00">THE ONLINE PART (Yjs, Hocuspocus, PostgreSQL, Prisma and Docker in use, the rest planned)</text>
  <rect x="32" y="376" width="140" height="64" rx="10" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="44" y="400" font-size="13" font-weight="700" fill="#13202a">Yjs (CRDT)</text><text x="44" y="418" font-size="10.5" fill="#6a7a84">not Automerge, ShareDB,</text><text x="44" y="431" font-size="10.5" fill="#6a7a84">Liveblocks, Firebase</text>
  <rect x="184" y="376" width="150" height="64" rx="10" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="196" y="400" font-size="13" font-weight="700" fill="#13202a">Hocuspocus</text><text x="196" y="418" font-size="10.5" fill="#6a7a84">not y-websocket,</text><text x="196" y="431" font-size="10.5" fill="#6a7a84">PartyKit, Durable Objects</text>
  <rect x="346" y="376" width="140" height="64" rx="10" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="358" y="400" font-size="13" font-weight="700" fill="#13202a">PostgreSQL</text><text x="358" y="418" font-size="10.5" fill="#6a7a84">not MongoDB, Firestore</text><text x="358" y="431" font-size="10.5" fill="#6a7a84">(SQLite first)</text>
  <rect x="498" y="376" width="130" height="64" rx="10" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="510" y="400" font-size="13" font-weight="700" fill="#13202a">Prisma 7.x</text><text x="510" y="418" font-size="10.5" fill="#6a7a84">not Drizzle, Kysely</text>
  <rect x="640" y="376" width="140" height="64" rx="10" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="652" y="400" font-size="13" font-weight="700" fill="#13202a">Docker</text><text x="652" y="418" font-size="10.5" fill="#6a7a84">not Homebrew Postgres</text>
  <rect x="792" y="376" width="136" height="64" rx="10" fill="#fbeed2" stroke="#8a5a00" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="804" y="400" font-size="13" font-weight="700" fill="#13202a">Cloudflare R2</text><text x="804" y="418" font-size="10.5" fill="#6a7a84">not S3, B2, server disk</text>
  <rect x="32" y="452" width="440" height="52" rx="10" fill="#fff" stroke="#8a5a00" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="44" y="474" font-size="13" font-weight="700" fill="#13202a">Login: Better Auth + GitHub (decided)</text><text x="44" y="492" font-size="10.5" fill="#6a7a84">not Auth.js (beta), Clerk, Lucia, Supabase Auth</text>
  <rect x="484" y="452" width="444" height="52" rx="10" fill="#fff" stroke="#8a5a00" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="496" y="474" font-size="13" font-weight="700" fill="#13202a">Where the collab server runs: not decided yet</text><text x="496" y="492" font-size="10.5" fill="#6a7a84">Fly.io, Railway, Render, a VPS: needs open WebSockets, so not Vercel</text>
  <text x="32" y="534" font-size="12" fill="#55656f">"Not X" lines are what else could do the same job; none of them is "bad". See WHY-THESE-TOOLS.md for when each would win.</text>
</svg>
