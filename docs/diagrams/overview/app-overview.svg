<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
  <title id="t">How SceneRoom works today: from a click to the screen</title>
  <desc id="d">A click or key press in the panels calls an action in a Zustand store. The action calls a plain function in the shared package that returns a new scene. The new scene is drawn by react-three-fiber and three.js, recorded as an Undo step, saved to IndexedDB by autosave, and big files such as meshes, models and pictures are kept apart under a hash. A project can be saved as a .sceneroom file or exported as a GLB. Vitest tests the plain functions and Playwright tests the whole app in a browser.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#13202a"/></marker></defs>
  <rect width="960" height="560" fill="#f2f5f6"/>
  <text x="32" y="38" font-size="22" font-weight="700" fill="#13202a">How SceneRoom works today</text>
  <text x="32" y="60" font-size="13" fill="#55656f">One idea: the scene is plain data. Every change is a plain function from the old scene to a new one. Everything else just reacts.</text>

  <rect x="32" y="84" width="190" height="96" rx="12" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="46" y="108" font-size="14" font-weight="700" fill="#13202a">1. You</text>
  <text x="46" y="128" font-size="12" fill="#13202a">click, drag, press keys,</text>
  <text x="46" y="145" font-size="12" fill="#13202a">use panels and buttons</text>
  <text x="46" y="162" font-size="12" fill="#55656f">(React components)</text>
  <path d="M222 132 H262" stroke="#13202a" stroke-width="2.2" fill="none" marker-end="url(#a)"/>

  <rect x="262" y="84" width="210" height="96" rx="12" fill="#e9eef0" stroke="#0a6c8a" stroke-width="2"/>
  <text x="276" y="108" font-size="14" font-weight="700" fill="#13202a">2. Store action</text>
  <text x="276" y="128" font-size="12" fill="#13202a">sceneStore, editStore, paintStore,</text>
  <text x="276" y="145" font-size="12" fill="#13202a">bakeStore (Zustand). One source</text>
  <text x="276" y="162" font-size="12" fill="#13202a">of truth for the scene.</text>
  <path d="M472 132 H512" stroke="#13202a" stroke-width="2.2" fill="none" marker-end="url(#a)"/>

  <rect x="512" y="84" width="240" height="96" rx="12" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="526" y="108" font-size="14" font-weight="700" fill="#13202a">3. Plain function</text>
  <text x="526" y="128" font-size="12" fill="#13202a">packages/shared: oldScene in,</text>
  <text x="526" y="145" font-size="12" fill="#13202a">newScene out. No screen, no state.</text>
  <text x="526" y="162" font-size="12" fill="#55656f">Easy to test (Vitest).</text>
  <path d="M752 132 H792" stroke="#13202a" stroke-width="2.2" fill="none" marker-end="url(#a)"/>

  <rect x="792" y="84" width="136" height="96" rx="12" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="806" y="108" font-size="14" font-weight="700" fill="#13202a">4. New scene</text>
  <text x="806" y="128" font-size="12" fill="#13202a">replaces the old</text>
  <text x="806" y="145" font-size="12" fill="#13202a">one in the store</text>

  <path d="M860 180 V214 M860 214 H770 M860 214 H520 M860 214 H270" stroke="#13202a" stroke-width="2.2" fill="none"/>
  <path d="M770 214 V240" stroke="#13202a" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <path d="M520 214 V240" stroke="#13202a" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <path d="M270 214 V240" stroke="#13202a" stroke-width="2.2" fill="none" marker-end="url(#a)"/>

  <rect x="32" y="240" width="470" height="110" rx="12" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="46" y="264" font-size="14" font-weight="700" fill="#13202a">5a. The 3D view redraws</text>
  <text x="46" y="285" font-size="12" fill="#13202a">react-three-fiber turns each object of the scene into a three.js</text>
  <text x="46" y="302" font-size="12" fill="#13202a">object; three.js draws it with WebGL. Edit mode, paint and the</text>
  <text x="46" y="319" font-size="12" fill="#13202a">gizmos are drawn on top. Meshes are built from stored points</text>
  <text x="46" y="336" font-size="12" fill="#13202a">and triangles plus the object's modifiers.</text>

  <rect x="520" y="240" width="200" height="110" rx="12" fill="#fff" stroke="#e08a00" stroke-width="2"/>
  <text x="534" y="264" font-size="14" font-weight="700" fill="#13202a">5b. Undo step</text>
  <text x="534" y="285" font-size="12" fill="#13202a">The old scene is kept.</text>
  <text x="534" y="302" font-size="12" fill="#13202a">Undo = put it back.</text>
  <text x="534" y="319" font-size="12" fill="#55656f">Each scene has its own</text>
  <text x="534" y="336" font-size="12" fill="#55656f">history.</text>

  <rect x="738" y="240" width="190" height="110" rx="12" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="752" y="264" font-size="14" font-weight="700" fill="#13202a">5c. Autosave</text>
  <text x="752" y="285" font-size="12" fill="#13202a">A moment later the</text>
  <text x="752" y="302" font-size="12" fill="#13202a">project is written to</text>
  <text x="752" y="319" font-size="12" fill="#13202a">the browser (IndexedDB).</text>

  <path d="M830 350 V380" stroke="#13202a" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <rect x="32" y="380" width="896" height="82" rx="12" fill="#e9eef0" stroke="#0a6c8a" stroke-width="2"/>
  <text x="46" y="404" font-size="14" font-weight="700" fill="#13202a">Big files live apart, under a fingerprint of their bytes (SHA-256)</text>
  <text x="46" y="425" font-size="12" fill="#13202a">Meshes (points and triangles, or small patches of them), imported models and painted or baked pictures are NOT inside the scene. The scene only</text>
  <text x="46" y="442" font-size="12" fill="#13202a">holds their id. Same bytes = same id = stored once. That keeps the scene small, the undo history cheap, and is what will let files travel online by id.</text>

  <rect x="32" y="480" width="290" height="62" rx="12" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="46" y="504" font-size="14" font-weight="700" fill="#13202a">Save, Open, Export</text>
  <text x="46" y="523" font-size="12" fill="#13202a">.sceneroom file, or GLB for other programs</text>
  <rect x="340" y="480" width="290" height="62" rx="12" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="354" y="504" font-size="14" font-weight="700" fill="#13202a">Vitest</text>
  <text x="354" y="523" font-size="12" fill="#13202a">tests the plain functions (no browser)</text>
  <rect x="648" y="480" width="280" height="62" rx="12" fill="#fff" stroke="#13202a" stroke-width="2"/>
  <text x="662" y="504" font-size="14" font-weight="700" fill="#13202a">Playwright</text>
  <text x="662" y="523" font-size="12" fill="#13202a">tests the whole app in a real browser</text>
</svg>
