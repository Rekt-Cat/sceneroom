name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The tests of the accounts and of the collab server use a real Postgres (the same settings as docker-compose.yml, which
    # is also the default address in packages/db/prisma.config.ts)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sceneroom
          POSTGRES_PASSWORD: sceneroom
          POSTGRES_DB: sceneroom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sceneroom -d sceneroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # Corepack ships with Node and installs the pnpm version pinned in package.json
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      # Builds the tables (the migrations in packages/db) before the tests that use them
      - run: pnpm --filter @sceneroom/db migrate:deploy

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm build

  # The browser tests: a real Chromium clicks through the editor (apps/web/e2e). Slower than the checks above, so it
  # is its own job and the quick checks report first.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      # Playwright's own Chromium, with the system libraries it needs (nothing is kept between runs)
      - run: pnpm --filter @sceneroom/web exec playwright install --with-deps chromium

      # Starts the dev server itself (see playwright.config.ts) and runs the tests against it
      - run: pnpm test:e2e

      # What the tests saw, when one fails: the report and the screenshots
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
